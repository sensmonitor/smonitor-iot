name: ESP-IDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.profile }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: lilygo-sim7000g
            target: esp32
            defaults: examples/lilygo_sim7000g/sdkconfig.defaults
          - profile: generic-esp32-uart-modem
            target: esp32
            defaults: examples/generic_esp32_uart_modem/sdkconfig.defaults
          - profile: generic-esp32s3-uart-modem
            target: esp32s3
            defaults: examples/generic_esp32s3_uart_modem/sdkconfig.defaults
          - profile: lilygo-sim7080-s3
            target: esp32s3
            defaults: examples/lilygo_sim7080_s3/sdkconfig.defaults
          - profile: lilygo-sim7670-s3
            target: esp32s3
            defaults: examples/lilygo_sim7670_s3/sdkconfig.defaults

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          path: "."
          command: >-
            idf.py -B build
            -D IDF_TARGET=${{ matrix.target }}
            -D SDKCONFIG=build/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;${{ matrix.defaults }}"
            build
