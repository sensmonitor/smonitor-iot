; PlatformIO build for SensMonitor IoT (ESP-IDF framework).
;
; Build, flash and monitor one board profile:
;   pio run -e lilygo-t-sim7000g -t upload -t monitor
;
; Operator settings (APN, PPP auth) go in sdkconfig.defaults.local, which is
; loaded after the board profile. Copy sdkconfig.defaults.local.example first.
; Each environment keeps its active configuration in sdkconfig.<env>; edit it
; with: pio run -e <env> -t menuconfig
;
; Defaults do not overwrite values already present in sdkconfig.<env>. Delete
; that file to regenerate it from the defaults.

[platformio]
src_dir = main
default_envs = lilygo-t-sim7000g

[env]
; Official PlatformIO platform with ESP-IDF pinned to 5.5.x, matching
; idf ">=5.5,<5.6" in main/idf_component.yml.
platform = platformio/espressif32@8.0.0
platform_packages =
    platformio/framework-espidf@~4.50505.0
    ; ESP-IDF 5.5.5 requires esp-14.2.0_20260121; the platform default for IDF 6.x is GCC 15.
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
framework = espidf
; Creates sdkconfig.defaults.local on first build, warns while the APN is empty
; and stops upload until it is set (override: SMONITOR_ALLOW_EMPTY_APN=1).
extra_scripts = pre:tools/pio_config_check.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:lilygo-t-sim7000g]
board = esp32dev
board_build.cmake_extra_args = -DSMONITOR_DEPENDENCIES_LOCK=.pio/dependencies.lilygo-t-sim7000g.lock -DSMONITOR_BOARD_DEFAULTS=examples/lilygo_sim7000g/sdkconfig.defaults

[env:lilygo-t-sim7080-s3]
board = esp32-s3-devkitc-1
board_build.cmake_extra_args = -DSMONITOR_DEPENDENCIES_LOCK=.pio/dependencies.lilygo-t-sim7080-s3.lock -DSMONITOR_BOARD_DEFAULTS=examples/lilygo_sim7080_s3/sdkconfig.defaults

[env:lilygo-t-sim7670-s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSMONITOR_DEPENDENCIES_LOCK=.pio/dependencies.lilygo-t-sim7670-s3.lock -DSMONITOR_BOARD_DEFAULTS=examples/lilygo_sim7670_s3/sdkconfig.defaults

[env:waveshare-esp32s3-a7670e]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSMONITOR_DEPENDENCIES_LOCK=.pio/dependencies.waveshare-esp32s3-a7670e.lock -DSMONITOR_BOARD_DEFAULTS=examples/waveshare_esp32s3_a7670e/sdkconfig.defaults

[env:generic-esp32-uart-modem]
board = esp32dev
board_build.cmake_extra_args = -DSMONITOR_DEPENDENCIES_LOCK=.pio/dependencies.generic-esp32-uart-modem.lock -DSMONITOR_BOARD_DEFAULTS=examples/generic_esp32_uart_modem/sdkconfig.defaults

[env:generic-esp32s3-uart-modem]
board = esp32-s3-devkitc-1
board_build.cmake_extra_args = -DSMONITOR_DEPENDENCIES_LOCK=.pio/dependencies.generic-esp32s3-uart-modem.lock -DSMONITOR_BOARD_DEFAULTS=examples/generic_esp32s3_uart_modem/sdkconfig.defaults
